name: All Builds

# Equinox ships only the Nintendo Switch build. windows.yml (manual) builds
# the Windows development target.
# Pushes to master are built by fork-switch-release.yml, which also
# publishes the release, so they are not built twice.
on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:

jobs:
  switch:
    name: Nintendo Switch
    uses: ./.github/workflows/docker-image.yml
